<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <p>First to 5 points wins.</p>

    <div id="buttons">
        <button class="choice" data-choice="0">Rock</button>
        <button class="choice" data-choice="1">Paper</button>
        <button class="choice" data-choice="2">Scissors</button>
    </div>

    <div id="results"></div>

    <div id="score">
        <p>Human: <span id="human-score">0</span></p>
        <p>Computer: <span id="computer-score">0</span></p>
    </div>

    <div id="winner"></div>
    <button id="reset" hidden>Play again</button>

    <script src="script.js"></script>
</body>
</html>
